<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login – MDKP City Services</title>

  <!-- Bootstrap & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <!-- Global styles & app -->
  <link rel="stylesheet" href="../styles.css" />
  <script>window.__CITY_API_BASE__ = '/City-DB/api/public/index.php';</script>
  <script src="../app.js" defer></script>
  <script src="./admin-auth.js" defer></script>
</head>
<body class="page-shell page-auth">
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">
      <a class="navbar-brand brand-badge" href="../index.html">
        <span class="brand-dot"></span><span>MDKP City Services</span>
      </a>
      <div class="ms-auto">
        <button id="themeToggle" class="btn btn-light theme-toggle" title="Toggle theme">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="section flex-grow-1 d-flex align-items-center">
    <div class="container py-5" style="max-width: 520px;">
      <h1 class="h4 mb-3 text-center">Admin Login</h1>
      <p class="text-secondary text-center mb-4">Use the admin credentials to access the dashboard.</p>

      <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

      <div class="card p-3">
        <form id="adminLoginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="adminEmail">Email</label>
            <input id="adminEmail" type="email" class="form-control" placeholder="admin@city.local" required />
            <div class="invalid-feedback">Valid email is required.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="adminPassword">Password</label>
            <div class="input-group">
              <input id="adminPassword" type="password" class="form-control" placeholder="••••••••" required />
              <button class="btn btn-outline-secondary toggle-pass" type="button" data-target="adminPassword">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <div class="form-text">Default: <code>admin@city.local</code> / <code>admin123</code></div>
            <div class="invalid-feedback">Password is required.</div>
          </div>

          <div class="d-grid">
            <button class="btn btn-primary" type="submit">
              <i class="fa-solid fa-right-to-bracket me-2"></i>Sign in
            </button>
          </div>
        </form>
      </div>

      <div class="text-center mt-3">
        <a class="small text-muted" href="../index.html">← Back to Home</a>
      </div>
      <div class="text-center small text-secondary mt-3">
        © <span id="year"></span> Majlis Daerah Kubang Pasu
      </div>
    </div>
  </main>

  <script>document.getElementById('year').textContent = new Date().getFullYear()</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
