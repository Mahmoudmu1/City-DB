<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notifications – MDKP City Services</title>

  <!-- Bootstrap & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <!-- Global styles & JS -->
  <link rel="stylesheet" href="../styles.css" />
  <script>window.__CITY_API_BASE__ = '/City-DB/api/public/index.php';</script>
  <script src="../app.js" defer></script>
  <script src="./resident.js" defer></script>
</head>

<body>
  <!-- NAV -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">
      <a class="navbar-brand brand-badge" href="../index.html">
        <span class="brand-dot"></span><span>MDKP City Services</span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button id="themeToggle" class="btn btn-light theme-toggle" title="Toggle theme">
          <i class="fa-solid fa-moon"></i>
        </button>
        <a href="dashboard.html" class="btn btn-outline-secondary">
          <i class="fa-solid fa-house me-2"></i>Dashboard
        </a>
        <div class="dropdown">
          <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2" type="button" id="residentUserMenu" data-bs-toggle="dropdown" aria-expanded="false">
            <img id="navAvatarImg" class="nav-avatar-img" alt="Profile menu">
            <span class="d-none d-md-inline">Account</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="profile.html"><i class="fa-solid fa-user me-2"></i>Profile</a></li>
            <li><button class="dropdown-item" type="button" data-bs-toggle="modal" data-bs-target="#logoutConfirmResident"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Logout</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="section">
    <div class="container">
      <!-- Header -->
      <div class="mb-4">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center" style="width:48px;height:48px;">
            <i class="fa-solid fa-bell text-white"></i>
          </div>
          <div>
            <h1 class="h4 mb-1">Notifications</h1>
            <p class="text-secondary mb-0">Stay updated with the latest service announcements and updates.</p>
          </div>
        </div>
      </div>

      <!-- Filter Controls -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <select id="filterType" class="form-select">
            <option value="">All Types</option>
            <option value="info">Info</option>
            <option value="warn">Warning</option>
            <option value="alert">Emergency</option>
            <option value="request">Request Updates</option>
          </select>
        </div>
        <div class="col-md-4">
          <select id="filterStatus" class="form-select">
            <option value="">All Status</option>
            <option value="active">Active</option>
            <option value="upcoming">Upcoming</option>
            <option value="expired">Expired</option>
          </select>
        </div>
        <div class="col-md-4">
          <button id="markAllRead" class="btn btn-outline-primary w-100">
            <i class="fa-solid fa-check-double me-2"></i>Mark All as Read
          </button>
        </div>
      </div>

      <!-- Notifications List -->
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">
            <i class="fa-solid fa-bell me-2"></i>Service &amp; Request Updates
            <span id="notificationCount" class="badge bg-primary ms-2">0</span>
          </h5>
        </div>
        <div class="card-body p-0">
          <div id="notificationsList">
            <!-- Notifications will be loaded here -->
            <div class="text-center py-5 text-muted">
              <i class="fa-solid fa-bell-slash fa-3x mb-3"></i>
              <p>No notifications available</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-white">
    <div class="container small text-secondary">© <span id="year"></span> Majlis Daerah Kubang Pasu</div>
  </footer>

  <div class="modal fade" id="logoutConfirmResident" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background: var(--card-bg);">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Log out</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to log out?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Stay logged in</button>
          <button type="button" class="btn btn-danger" id="confirmLogoutResident">Log out</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
