<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Account – MDKP City Services</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <!-- Global styles & app js -->
    <link rel="stylesheet" href="../styles.css" />
    <script>window.__CITY_API_BASE__ = '/City-DB/api/public/index.php';</script>
    <script src="../app.js" defer></script>
    <script src="./resident.js" defer></script>
</head>

<body class="page-shell page-auth">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container py-2">
            <a class="navbar-brand brand-badge" href="../index.html">
                <span class="brand-dot" aria-hidden="true"></span>
                <span>MDKP City Services</span>
            </a>
        </div>
    </nav>


    <main class="section flex-grow-1 d-flex align-items-center">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card shadow-soft p-4">
                        <h1 class="h4 mb-1">Create your account</h1>
                        <p class="text-secondary mb-4">Use a valid email to receive updates on your requests.</p>


                        <div id="signupAlert" class="alert alert-danger d-none" role="alert"></div>
                        <div id="signupSuccess" class="alert alert-success d-none" role="alert"></div>


                        <form id="signupForm" novalidate>
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label for="firstName" class="form-label">First name</label>
                                    <input type="text" id="firstName" class="form-control" required />
                                    <div class="invalid-feedback">First name is required.</div>
                                </div>
                                <div class="col-sm-6">
                                    <label for="lastName" class="form-label">Last name</label>
                                    <input type="text" id="lastName" class="form-control" required />
                                    <div class="invalid-feedback">Last name is required.</div>
                                </div>
                                <div class="col-12">
                                    <label for="signupEmail" class="form-label">Email</label>
                                    <input type="email" id="signupEmail" class="form-control"
                                        placeholder="you@example.com" required />
                                    <div class="invalid-feedback">Please enter a valid email.</div>
                                </div>
                                <div class="col-sm-6">
                                    <label for="signupPassword" class="form-label">Password</label>
                                    <div class="input-group">
                                        <input type="password" id="signupPassword" class="form-control" minlength="6"
                                            required />
                                        <button type="button" class="btn btn-light border toggle-pass"
                                            data-target="signupPassword" aria-label="Show password">
                                            <i class="fa-regular fa-eye"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback">At least 6 characters.</div>
                                </div>

                                <div class="col-sm-6">
                                    <label for="confirmPassword" class="form-label">Confirm password</label>
                                    <div class="input-group">
                                        <input type="password" id="confirmPassword" class="form-control" minlength="6"
                                            required />
                                        <button type="button" class="btn btn-light border toggle-pass"
                                            data-target="confirmPassword" aria-label="Show password">
                                            <i class="fa-regular fa-eye"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback">Passwords must match.</div>
                                </div>
                                <div class="col-12">
                                    <label for="address" class="form-label">Address (optional)</label>
                                    <input type="text" id="address" class="form-control"
                                        placeholder="Street, Taman, Postcode" />
                                </div>
                            </div>
                            <button class="btn btn-primary w-100 mt-3" type="submit">
                                <i class="fa-solid fa-user-plus me-2"></i>Create account
                            </button>
                        </form>


                        <div class="text-center mt-3">
                            <span class="small text-muted">Already have an account?</span>
                            <a class="small" href="login.html">Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <footer class="py-4 bg-white">
        <div class="container small text-secondary">© <span id="year"></span> Majlis Daerah Kubang Pasu</div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>document.getElementById('year').textContent = new Date().getFullYear()</script>
</body>

</html>
