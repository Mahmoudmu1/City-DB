<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resident Feedback – MDKP City Services</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="../styles.css" />
    <script>window.__CITY_API_BASE__ = '/City-DB/api/public/index.php';</script>
    <script src="../app.js" defer></script>
    <script src="./feedback.js" defer></script>
</head>

<body class="page-shell page-auth">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container py-2">
            <a class="navbar-brand brand-badge" href="dashboard.html">
                <span class="brand-dot" aria-hidden="true"></span>
                <span>MDKP City Services</span>
            </a>
            <div class="ms-auto">
                <a class="btn btn-outline-secondary" href="dashboard.html"><i class="fa-solid fa-arrow-left me-2"></i>Back to dashboard</a>
            </div>
        </div>
    </nav>

    <main class="section flex-grow-1 d-flex align-items-center">
        <div class="container py-5" style="max-width: 600px;">
            <div class="card p-4 shadow-soft">
                <h1 class="h4 mb-2">Share Your Feedback</h1>
                <p class="text-secondary mb-4">Help us improve MDKP City Services by rating your experience.</p>

                <div id="feedbackSuccess" class="alert alert-success d-none" role="alert"></div>
                <div id="feedbackError" class="alert alert-danger d-none" role="alert"></div>

                <form id="feedbackForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="feedbackRating">Rating</label>
                        <select id="feedbackRating" class="form-select" required>
                            <option value="" selected disabled>Choose a rating</option>
                            <option value="5">5 – Excellent</option>
                            <option value="4">4 – Good</option>
                            <option value="3">3 – Fair</option>
                            <option value="2">2 – Poor</option>
                            <option value="1">1 – Very poor</option>
                        </select>
                        <div class="invalid-feedback">Please select a rating.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="feedbackCategory">Category</label>
                        <select id="feedbackCategory" class="form-select" required>
                            <option value="overall" selected>Overall experience</option>
                            <option value="request">Request handling</option>
                            <option value="usability">Portal usability</option>
                            <option value="communication">Communication &amp; updates</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="feedbackComments">Comments</label>
                        <textarea id="feedbackComments" class="form-control" rows="4" placeholder="Share what went well or what can be improved"></textarea>
                    </div>

                    <button id="feedbackSubmit" class="btn btn-primary w-100" type="submit">
                        <i class="fa-solid fa-paper-plane me-2"></i>Send feedback
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
