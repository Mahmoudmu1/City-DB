<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resident Login – MDKP City Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
    <script>window.__CITY_API_BASE__ = '/City-DB/api/public/index.php';</script>
    <script src="../app.js" defer></script>
    <script src="./resident.js" defer></script>
</head>

<body class="page-shell page-auth">
    <!-- NAVBAR (same as index, brand links back) -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container py-2">
            <a class="navbar-brand brand-badge" href="../index.html">
                <span class="brand-dot" aria-hidden="true"></span>
                <span>MDKP City Services</span>
            </a>

        </div>
    </nav>


    <main class="section flex-grow-1 d-flex align-items-center">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card shadow-soft p-4">
                        <h1 class="h4 mb-1">Resident Login</h1>
                        <p class="text-secondary mb-4">Enter your account email and password.</p>


                        <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>


                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com"
                                    required />
                                <div class="invalid-feedback">Please enter a valid email.</div>
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="loginPassword"
                                        placeholder="Your password" minlength="6" required />
                                    <button type="button" class="btn btn-light border toggle-pass"
                                        data-target="loginPassword" aria-label="Show password">
                                        <i class="fa-regular fa-eye"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback">Password must be at least 6 characters.</div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe" />
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                                <a class="small" href="signup.html">Create account</a>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">
                                <i class="fa-solid fa-right-to-bracket me-2"></i>Login
                            </button>
                        </form>


                        <div class="text-center mt-3">
                            <a class="small text-muted" href="../index.html">← Back to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <footer class="py-4 bg-white">
        <div class="container small text-secondary">© <span id="year"></span> Majlis Daerah Kubang Pasu</div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>document.getElementById('year').textContent = new Date().getFullYear()</script>
</body>

</html>
